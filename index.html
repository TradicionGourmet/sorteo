<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo - Tradición Gourmet</title>
    <!-- Librería ligera para el efecto de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 350px;
            width: 90%;
            position: relative;
            z-index: 10;
        }
        h1 { color: #d97706; font-size: 24px; margin-bottom: 10px; }
        p { font-size: 16px; color: #555; line-height: 1.5; }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
        }
        .winner {
            background-color: #d1fae5;
            color: #065f46;
            border: 2px dashed #10b981;
            animation: pop 0.5s ease-out;
        }
        .loser {
            background-color: #f3f4f6;
            color: #4b5563;
            border: 2px solid #d1d5db;
        }
        @keyframes pop {
            0% { transform: scale(0.8); }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🍰 Tradición Gourmet</h1>
        <p>¡Gracias por adquirir tu delicioso cake artesanal! Descubre si este empaque trae una porción gratis.</p>
        
        <div id="result" class="result-box loser">
            Verificando tu código...
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cakeId = urlParams.get('cake');
        const resultDiv = document.getElementById('result');

        // Cake ganador
        const cakeGanador = "3"; 

        function lanzarConfeti() {
            // Lanza dos explosiones de confeti desde los lados
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
            setTimeout(() => {
                confetti({
                    particleCount: 60,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 60,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });
            }, 300);
        }

        if (!cakeId) {
            resultDiv.className = "result-box loser";
            resultDiv.innerHTML = "⚠️ Enlace incompleto o inválido.";
        } else if (cakeId === cakeGanador) {
            resultDiv.className = "result-box winner";
            resultDiv.innerHTML = "🎉 ¡FELICIDADES! ¡Has ganado una PORCIÓN GRATIS de cake! Muéstrale esta pantalla al vendedor.";
            lanzarConfeti();
        } else {
            resultDiv.className = "result-box loser";
            resultDiv.innerHTML = "😢 ¡Gracias por comprar! Este empaque no resultó ganador, ¡pero te esperamos en el próximo!";
        }
    </script>
</body>
</html>
