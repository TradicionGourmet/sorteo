<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo - Tradición Gourmet</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 330px;
            width: 90%;
        }
        h1 { color: #d97706; font-size: 22px; margin-bottom: 5px; }
        p { font-size: 14px; color: #555; margin-bottom: 20px; }

        .wheel-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 20px auto;
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-top: 20px solid #ef4444;
            z-index: 20;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #d97706;
            position: relative;
            transform: rotate(0deg);
            transition: transform 4s cubic-bezier(0.15, 0.95, 0.15, 1);
            background: conic-gradient(
                #f59e0b 0deg 72deg,
                #f3f4f6 72deg 144deg,
                #fbbf24 144deg 216deg,
                #e5e7eb 216deg 288deg,
                #d97706 288deg 360deg
            );
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: white;
            border: 3px solid #d97706;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }
        .btn {
            background-color: #d97706;
            color: white;
            border: none;
            padding: 13px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3);
        }
        .btn:disabled { background-color: #9ca3af; box-shadow: none; cursor: not-allowed; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            backdrop-filter: blur(3px);
        }
        .modal-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 310px;
            width: 85%;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            animation: popIn 0.35s ease-out;
        }
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-icon { font-size: 45px; margin-bottom: 10px; }
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .winner-title { color: #059669; }
        .loser-title { color: #4b5563; }
        .modal-text { font-size: 15px; color: #374151; line-height: 1.4; margin-bottom: 20px; }

        .ig-btn {
            display: inline-block;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(220, 39, 67, 0.3);
        }
        .close-btn {
            background: #e5e7eb;
            color: #374151;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🍰 Tradición Gourmet</h1>
        <p id="instruction-text">¡Gira la ruleta frente al vendedor para descubrir si ganas una porción gratis!</p>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <div id="wheel" class="wheel">
                <div class="wheel-center">🍰</div>
            </div>
        </div>

        <button id="spin-btn" class="btn" onclick="girarRuleta()">¡Girar Ruleta!</button>
    </div>

    <div id="result-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div id="modal-icon" class="modal-icon">🎉</div>
            <div id="modal-title" class="modal-title">¡FELICIDADES!</div>
            <div id="modal-text" class="modal-text">Has ganado una porción gratis.</div>
            
            <a href="https://www.instagram.com/tradicion.gourmett/" target="_blank" class="ig-btn">
                📸 Síguenos en @tradicion.gourmett
            </a>
            
            <button class="close-btn" onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>

    <script>
        let gradosTotales = 0;
        const TIEMPO_ESPERA = 24 * 60 * 60 * 1000; // 24 horas

        window.onload = function() {
            verificarBloqueo();
        };

        function verificarBloqueo() {
            const ultimoGiro = localStorage.getItem('tg_ultimo_giro');
            if (ultimoGiro) {
                const tiempoTranscurrido = new Date().getTime() - parseInt(ultimoGiro);
                if (tiempoTranscurrido < TIEMPO_ESPERA) {
                    const horasRestantes = Math.ceil((TIEMPO_ESPERA - tiempoTranscurrido) / (1000 * 60 * 60));
                    bloquearBoton(horasRestantes);
                } else {
                    // Si ya pasaron las 24 horas, limpiamos el registro para permitir un nuevo giro
                    localStorage.removeItem('tg_ultimo_giro');
                }
            }
        }

        function bloquearBoton(horas) {
            const btn = document.getElementById('spin-btn');
            btn.disabled = true;
            btn.style.backgroundColor = "#9ca3af";
            btn.innerHTML = `⏳ Ya participaste (~${horas}h restantes)`;
            document.getElementById('instruction-text').innerHTML = `Este dispositivo ya registró un giro. Podrás volver a participar en aproximadamente ${horas} hora(s).`;
        }

        function girarRuleta() {
            // Validación estricta antes de girar
            const ultimoGiro = localStorage.getItem('tg_ultimo_giro');
            if (ultimoGiro && (new Date().getTime() - parseInt(ultimoGiro) < TIEMPO_ESPERA)) {
                alert("Ya has utilizado tu oportunidad en las últimas 24 horas.");
                return;
            }

            const btn = document.getElementById('spin-btn');
            const wheel = document.getElementById('wheel');

            btn.disabled = true;

            // GUARDAR CANDADO INMEDIATO (Antes de que termine la animación)
            localStorage.setItem('tg_ultimo_giro', new Date().getTime().toString());

            // Probabilidad estricta del 5% (Math.random genera de 0 a 1, <= 0.05 es exactamente el 5%)
            const esGanador = Math.random() <= 0.05;
            
            const vueltasBase = 1800;
            let anguloExtra = esGanador ? 36 : 144; 
            
            gradosTotales += vueltasBase + anguloExtra + Math.floor(Math.random() * 30);
            wheel.style.transform = `rotate(${gradosTotales}deg)`;

            setTimeout(() => {
                mostrarModal(esGanador);
            }, 4000);
        }

        function mostrarModal(esGanador) {
            const modal = document.getElementById('result-modal');
            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            const text = document.getElementById('modal-text');

            if (esGanador) {
                icon.innerHTML = "🎉";
                title.innerHTML = "¡FELICIDADES!";
                title.className = "modal-title winner-title";
                text.innerHTML = "¡Has ganado una <b>PORCIÓN GRATIS de cake</b>! Muéstrale esta ventana al vendedor para reclamarla.";
                confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 }, zIndex: 100 });
            } else {
                icon.innerHTML = "🍰";
                title.innerHTML = "¡Gracias por comprar!";
                title.className = "modal-title loser-title";
                text.innerHTML = "Esta vez no hubo premio, ¡pero disfruta tu cake y síguenos en Instagram para más sorteos!";
            }

            modal.classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('result-modal').classList.add('hidden');
            verificarBloqueo();
        }
    </script>
</body>
</html>
