<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo - Tradición Gourmet</title>
    <!-- Librería para el efecto de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 350px;
            width: 90%;
            position: relative;
            z-index: 10;
        }
        h1 { color: #d97706; font-size: 24px; margin-bottom: 10px; }
        p { font-size: 16px; color: #555; line-height: 1.5; }
        
        .btn {
            background-color: #d97706;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3);
        }
        .btn:hover { background-color: #b45309; }
        .btn:active { transform: scale(0.97); }

        .countdown-container {
            margin: 20px 0;
            height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .countdown {
            font-size: 65px;
            font-weight: bold;
            color: #d97706;
            animation: zoomEffect 1s ease-in-out infinite;
        }

        /* Animación de zoom individual para cada número */
        @keyframes zoomEffect {
            0% {
                transform: scale(0.4);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            animation: pop 0.5s ease-out;
        }
        .winner {
            background-color: #d1fae5;
            color: #065f46;
            border: 2px dashed #10b981;
        }
        .loser {
            background-color: #f3f4f6;
            color: #4b5563;
            border: 2px solid #d1d5db;
        }
        @keyframes pop {
            0% { transform: scale(0.8); }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🍰 Tradición Gourmet</h1>
        <p>¡Gracias por adquirir tu delicioso cake artesanal! Descubre si este empaque trae una porción gratis.</p>
        
        <!-- Pantalla inicial con el botón -->
        <div id="start-section">
            <button class="btn" onclick="iniciarSorteo()">¡Descubrir Resultado, Suerte!</button>
        </div>

        <!-- Pantalla de cuenta regresiva (inicialmente oculta) -->
        <div id="countdown-section" class="hidden">
            <div class="countdown-container">
                <div id="countdown-number" class="countdown">3</div>
            </div>
            <p>Calculando tu suerte...</p>
        </div>

        <!-- Pantalla de resultado (inicialmente oculta) -->
        <div id="result" class="result-box hidden"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cakeId = urlParams.get('cake');
        const cakeGanador = "3"; 

        function iniciarSorteo() {
            if (!cakeId) {
                document.getElementById('start-section').classList.add('hidden');
                const res = document.getElementById('result');
                res.className = "result-box loser";
                res.innerHTML = "⚠️ Enlace incompleto o inválido.";
                res.classList.remove('hidden');
                return;
            }

            document.getElementById('start-section').classList.add('hidden');
            document.getElementById('countdown-section').classList.remove('hidden');

            let contador = 3;
            const numeroDiv = document.getElementById('countdown-number');
            numeroDiv.innerHTML = contador;

            const intervalo = setInterval(() => {
                contador--;
                if (contador > 0) {
                    numeroDiv.innerHTML = contador;
                    // Truco para reiniciar la animación de zoom en cada número
                    numeroDiv.style.animation = 'none';
                    numeroDiv.offsetHeight; // Forzar redibujado
                    numeroDiv.style.animation = 'zoomEffect 1s ease-in-out infinite';
                } else {
                    clearInterval(intervalo);
                    mostrarResultado();
                }
            }, 1000);
        }

        function mostrarResultado() {
            document.getElementById('countdown-section').classList.add('hidden');
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('hidden');

            if (cakeId === cakeGanador) {
                resultDiv.className = "result-box winner";
                resultDiv.innerHTML = "🎉 ¡FELICIDADES! ¡Has ganado una PORCIÓN GRATIS de cake! Muéstrale esta pantalla al vendedor.";
                lanzarConfetti();
            } else {
                resultDiv.className = "result-box loser";
                resultDiv.innerHTML = "😢 ¡Gracias por comprar! Este empaque no resultó ganador, ¡pero te esperamos en el próximo!";
            }
        }

        function lanzarConfetti() {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
            setTimeout(() => {
                confetti({
                    particleCount: 60,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 60,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });
            }, 300);
        }
    </script>
</body>
</html>
