<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo - Tradición Gourmet</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        h1 { color: #d97706; font-size: 24px; margin-bottom: 10px; }
        p { font-size: 16px; color: #555; line-height: 1.5; }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
        }
        .winner {
            background-color: #d1fae5;
            color: #065f46;
            border: 2px dashed #10b981;
        }
        .loser {
            background-color: #f3f4f6;
            color: #4b5563;
            border: 2px solid #d1d5db;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🍰 Tradición Gourmet</h1>
        <p>¡Gracias por adquirir tu delicioso cake artesanal! Descubre si este empaque trae una porción gratis.</p>
        
        <div id="result" class="result-box loser">
            Verificando tu código...
        </div>
    </div>

    <script>
        // Lee el número del cake desde la dirección web (ej: ?cake=1)
        const urlParams = new URLSearchParams(window.location.search);
        const cakeId = urlParams.get('cake');
        const resultDiv = document.getElementById('result');

        // AQUÍ ELIGES CUÁL ES EL GANADOR (1, 2, 3 o 4)
        // Por ejemplo, ponemos que el gancho ganador sea el número 3:
        const cakeGanador = "3"; 

        if (!cakeId) {
            resultDiv.className = "result-box loser";
            resultDiv.innerHTML = "⚠️ Enlace incompleto o inválido.";
        } else if (cakeId === cakeGanador) {
            resultDiv.className = "result-box winner";
            resultDiv.innerHTML = "🎉 ¡FLETES Y VICTORIA! ¡Has ganado una PORCIÓN GRATIS de cake! Muéstrale esta pantalla al vendedor.";
        } else {
            resultDiv.className = "result-box loser";
            resultDiv.innerHTML = "😢 ¡Gracias por comprar! Este empaque no resultó ganador, ¡pero te esperamos en el próximo!";
        }
    </script>
</body>
</html>
